<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נגזרת ומשיק</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: calm graph-paper notebook; teal-ink primary, amber for hints, green for success. */
:root {
  --bg: #f4f6f5; --card: #ffffff; --ink: #1c2a2b; --muted: #5b6b6c; --line: #dbe3e1;
  --accent: #0b7a75; --accent-ink: #ffffff; --accent-soft: #e0f1ef;
  --ok: #1f8a4c; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff1d6; --info-soft: #e8eef3;
  --grid: rgba(11, 122, 117, .07);
  --font: "Heebo", "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a1a; --card: #1a2424; --ink: #e6efee; --muted: #9db0ae; --line: #2c3b3a;
  --accent: #4cc3bb; --accent-ink: #082624; --accent-soft: #163433;
  --ok: #5ed08d; --ok-soft: #153325; --warn: #ffc15a; --warn-soft: #3a2a0c; --info-soft: #1f2d38; --grid: rgba(76, 195, 187, .07); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121a1a; --card: #1a2424; --ink: #e6efee; --muted: #9db0ae; --line: #2c3b3a;
  --accent: #4cc3bb; --accent-ink: #082624; --accent-soft: #163433;
  --ok: #5ed08d; --ok-soft: #153325; --warn: #ffc15a; --warn-soft: #3a2a0c; --info-soft: #1f2d38; --grid: rgba(76, 195, 187, .07); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.7;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
.streak { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.streak .dots { display: flex; gap: 4px; }
.streak i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); display: block; transition: .25s; }
.streak i.on { background: var(--ok); border-color: var(--ok); transform: scale(1.15); }
#progress { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#progress::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-width: 32px; height: 32px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; }
.chip.past { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
main { max-width: 760px; margin: 0 auto; padding: 18px 16px 90px; }
.kicker { color: var(--accent); font-size: .85rem; font-weight: 700; letter-spacing: .04em; }
h2 { margin: 2px 0 14px; font-size: 1.65rem; line-height: 1.25; text-wrap: balance; }
.stack { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 18px; box-shadow: 0 1px 0 rgba(0,0,0,.03); }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 10px; border-radius: 99px; margin-bottom: 8px; }
.teach { border-inline-start: 5px solid var(--accent); }
.p { margin: 6px 0; }
.rules { margin: 8px 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; }
.callout { margin: 10px 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; font-weight: 600; }
.m { unicode-bidi: isolate; direction: ltr; display: inline-block; font-family: var(--font); font-size: 1.04em; padding: 0 2px; white-space: nowrap; }
.m sup { font-size: .72em; line-height: 0; position: relative; top: -.1em; margin-inline-start: 1px; }
.m sub { font-size: .72em; line-height: 0; }
.fr { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; line-height: 1.15; margin: 0 2px; font-size: .95em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; }
.fr > span:last-child { padding: 1px 3px 0; }
.prob { margin: 4px 0 8px; font-size: 1.06rem; font-weight: 500; }
.steps { margin: 6px 0 10px; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 8px; }
.step { animation: rise .3s ease both; }
.example.done { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fig { margin: 10px auto 2px; max-width: 380px; }
.fig svg { width: 100%; height: auto; display: block; }
.axis { stroke: var(--muted); fill: var(--muted); stroke-width: 1.4; }
path.axis { stroke: none; }
.curve { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linejoin: round; }
.tan { stroke: var(--warn); stroke-width: 2; stroke-dasharray: none; }
.dot { fill: var(--ink); }
.lbl { fill: var(--ink); font-size: 12px; font-family: var(--font); font-weight: 600; }
.sec { margin: 12px 0 -4px; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
.sec::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.item.complete { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.parts { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
.part { border-top: 1px dashed var(--line); padding-top: 12px; }
.part:first-child { border-top: 0; padding-top: 0; }
.pq { margin-bottom: 8px; }
.row { display: flex; gap: 8px; }
.in { flex: 1; min-width: 0; font: 1.05rem/1.4 var(--mono); padding: 11px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); text-align: left; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.in.good { border-color: var(--ok); background: var(--ok-soft); }
.keys { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; direction: ltr; }
.krow { display: flex; flex-wrap: wrap; gap: 6px; }
.key.wide { min-width: 52px; }
.key { min-width: 36px; height: 40px; padding: 0 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 1rem var(--mono); cursor: pointer; }
.key:active { background: var(--accent-soft); }
.btn { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .key:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; padding: 6px 2px; align-self: flex-start; }
.tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.fb { margin-top: 10px; border-radius: 10px; }
.fb:empty { display: none; }
.fb.ok, .fb.warn, .fb.info { padding: 10px 14px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.fb.ok .after { font-weight: 500; color: var(--ink); margin-top: 4px; }
.fb.warn { background: var(--warn-soft); color: var(--ink); border-inline-start: 4px solid var(--warn); }
.fb.info { background: var(--info-soft); }
.hint { margin-top: 8px; padding: 9px 13px; background: var(--warn-soft); border-radius: 10px; animation: rise .3s ease both; }
.sol { margin-top: 10px; padding: 12px 14px; background: var(--info-soft); border-radius: 10px; }
.sol ol { margin: 4px 0 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.extra { display: flex; flex-direction: column; gap: 10px; }
.extra > .btn { align-self: flex-start; }
.finish { text-align: center; border: 2px solid var(--accent); }
.finish .big { font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; }
.finish.final { background: linear-gradient(180deg, var(--accent-soft), var(--card)); }
.finish .wish { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
#toast { position: fixed; inset-inline: 16px; bottom: 18px; margin: 0 auto; width: fit-content; max-width: 92vw; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: none; }
.clap { position: fixed; left: 50%; top: 42%; font-size: 64px; z-index: 30; pointer-events: none; animation: clap 1.05s ease-out forwards; }
@keyframes clap { 0% { transform: translate(-50%, 0) scale(.4); opacity: 0; } 25% { transform: translate(-50%, -10px) scale(1.25) rotate(-8deg); opacity: 1; } 45% { transform: translate(-50%, -14px) scale(1.05) rotate(8deg); } 100% { transform: translate(-50%, -80px) scale(1); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
@media (prefers-reduced-motion: reduce) { .step, .hint, .clap { animation: none; } .clap { display: none; } }
@media (max-width: 420px) { body { font-size: 16.5px; } h2 { font-size: 1.45rem; } .btn { padding: 10px 14px; } }

.foot { margin-top: 8px; font-size: .88rem; color: var(--muted); }
.calc { margin-top: 6px; min-height: 0; text-align: left; direction: ltr; font: 600 1.05rem var(--mono); color: var(--accent); }
.calc:empty { display: none; }
.calc { background: var(--accent-soft); padding: 6px 12px; border-radius: 8px; width: fit-content; }
.hintline{font-size:.9rem;color:var(--muted,#5b6b6a);margin:-4px 0 12px}

.pad{margin-top:14px;border:1px dashed var(--line,#c9d6d4);border-radius:12px;padding:8px 12px}
.pad summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.padnote{font-size:.9rem;color:var(--muted,#5b6b6a);margin:6px 0 10px}
.padline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.padline .in{flex:1;min-width:0}
.padout{font:600 1rem var(--mono);color:var(--accent);direction:ltr;white-space:nowrap}
.item .prob { position: sticky; top: var(--hh, 96px); z-index: 4; background: var(--card); margin: 0 -16px 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); box-shadow: 0 4px 6px -6px rgba(0,0,0,.25); }

.padline{display:block;margin-bottom:10px}
.padrow{display:flex;align-items:center;gap:8px}
.padrow .in{flex:1;min-width:0}
.padrow .btn{padding:10px 12px}
.padfb{margin-top:6px}.padfb:empty{display:none}

</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><a href="../" style="font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;margin-inline-end:10px" target="_top">→ חזרה לנגזרת</a><h1>נגזרת ומשיק</h1>
    <div class="streak" aria-label="רצף הצלחות"><span>רצף <b id="streakNum">0</b></span><span class="dots" id="streakDots"></span></div></div>
  <nav id="progress" aria-label="נושאי השיעור"></nav>
</div></header>
<main id="main"></main>
<div id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
/* engine.js - answer parsing/checking + polynomial helpers */
(function (root) {
  'use strict';
  const TOL = 1e-6;
  const close = (a, b) => Math.abs(a - b) <= TOL * (1 + Math.abs(b));
  class Bad extends Error {}

  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[−‒–—־]/g, '-')
      .replace(/[×·∙⋅]/g, '*')
      .replace(/÷/g, '/')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4')
      .replace(/⁵/g, '^5').replace(/⁶/g, '^6')
      .replace(/،/g, ',');
  }

  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const num = s.slice(i, j);
        if ((num.match(/\./g) || []).length > 1 || num === '.') throw new Bad('num');
        t.push({ k: 'n', v: parseFloat(num) }); i = j; continue;
      }
      if (/[xyXY]/.test(ch)) { t.push({ k: 'v', v: ch.toLowerCase() }); i++; continue; }
      if ('+-*/^()'.indexOf(ch) >= 0) { t.push({ k: 'o', v: ch }); i++; continue; }
      throw new Bad('char');
    }
    return t;
  }

  function compile(str) {
    const tokens = tokenize(norm(str));
    if (!tokens.length) throw new Bad('empty');
    let p = 0;
    const peek = () => tokens[p];
    const isOp = (t, v) => t && t.k === 'o' && t.v === v;
    function expr() {
      let l = term();
      while (peek() && (isOp(peek(), '+') || isOp(peek(), '-'))) {
        const op = tokens[p++].v; const r = term(); const a = l;
        l = op === '+' ? (e => a(e) + r(e)) : (e => a(e) - r(e));
      }
      return l;
    }
    function term() {
      let l = unary();
      for (;;) {
        const t = peek(); if (!t) break;
        if (isOp(t, '*')) { p++; const r = unary(); const a = l; l = e => a(e) * r(e); }
        else if (isOp(t, '/')) { p++; const r = unary(); const a = l; l = e => a(e) / r(e); }
        else if (t.k === 'v' || isOp(t, '(') || (t.k === 'n' && isOp(tokens[p - 1], ')'))) {
          const r = power(); const a = l; l = e => a(e) * r(e);
        } else break;
      }
      return l;
    }
    function unary() {
      if (isOp(peek(), '-')) { p++; const a = unary(); return e => -a(e); }
      if (isOp(peek(), '+')) { p++; return unary(); }
      return power();
    }
    function power() {
      const b = atom();
      if (isOp(peek(), '^')) { p++; const ex = unary(); return e => Math.pow(b(e), ex(e)); }
      return b;
    }
    function atom() {
      const t = tokens[p++];
      if (!t) throw new Bad('end');
      if (t.k === 'n') { const v = t.v; return () => v; }
      if (t.k === 'v') { const name = t.v; return e => { if (!(name in e)) throw new Bad('var'); return e[name]; }; }
      if (isOp(t, '(')) { const f = expr(); if (!isOp(tokens[p++], ')')) throw new Bad('paren'); return f; }
      throw new Bad('atom');
    }
    const f = expr();
    if (p !== tokens.length) throw new Bad('trail');
    return f;
  }

  const stripName = s => s.replace(/^\s*[A-Za-zא-ת][A-Za-zא-ת_0-9']*(\([^()]*\))?\s*=\s*/, '');
  const splitList = s => norm(s).replace(/(^|\s)או(?=\s|$)/g, ' ; ').split(/[;,]/).map(x => x.trim()).filter(Boolean);

  function evalNum(f, env) {
    const v = f(env || {});
    if (!isFinite(v)) throw new Bad('nan');
    return v;
  }
  function parseNum(raw) { return evalNum(compile(stripName(norm(raw)))); }
  function uniq(arr, eq) { const r = []; arr.forEach(a => { if (!r.some(b => eq(a, b))) r.push(a); }); return r; }
  function parseSet(raw) {
    const parts = splitList(raw); if (!parts.length) throw new Bad('empty');
    return uniq(parts.map(parseNum), close);
  }
  function parsePointInner(s) {
    s = norm(s).replace(/^\s*[A-Za-zא-ת]*\s*/, '').replace(/[()]/g, '');
    const parts = s.split(/[;,]/).map(x => x.trim()).filter(Boolean);
    if (parts.length !== 2) throw new Bad('pt');
    return parts.map(parseNum);
  }
  function parsePoint(raw) { return parsePointInner(raw); }
  function parsePoints(raw) {
    const s = norm(raw); const out = []; const re = /\(([^()]*)\)/g; let m;
    while ((m = re.exec(s))) out.push(parsePointInner(m[1]));
    if (!out.length) throw new Bad('pts');
    return uniq(out, (a, b) => close(a[0], b[0]) && close(a[1], b[1]));
  }
  function parseExprFn(raw) {
    const f = compile(stripName(norm(raw)));
    const xs = [-3, -2, -1, 0, 1, 2, 3, 0.5, -1.5];
    const vals = xs.map(x => evalNum(f, { x }));
    return { f, xs, vals };
  }
  function parseLine(raw) {
    const s = norm(raw); const eqs = s.split('=');
    if (eqs.length !== 2) throw new Bad('eq');
    const L = compile(eqs[0]), R = compile(eqs[1]);
    const F = (x, y) => evalNum(L, { x, y }) - evalNum(R, { x, y });
    const c = F(0, 0), a = F(1, 0) - c, b = F(0, 1) - c;
    [[2, 3], [-1, 2], [0.5, -4]].forEach(([x, y]) => {
      if (Math.abs(F(x, y) - (a * x + b * y + c)) > 1e-6 * (1 + Math.abs(c))) throw new Bad('nonlinear');
    });
    return { a, b, c };
  }
  function parseLines(raw) {
    const parts = splitList(raw); if (!parts.length) throw new Bad('empty');
    return parts.map(parseLine);
  }

  const lineEq = (L, m, b) => Math.abs(L.b) > 1e-9 && close(L.a / L.b, -m) && close(L.c / L.b, -b);
  const ptEq = (p, q) => close(p[0], q[0]) && close(p[1], q[1]);

  function trimC(c) { const r = c.slice(); while (r.length > 1 && Math.abs(r[r.length - 1]) < 1e-12) r.pop(); return r; }
  const polyEval = (c, x) => c.reduce((s, a, i) => s + a * Math.pow(x, i), 0);

  // returns 'ok' | 'partial' | 'bad'
  function judge(spec, raw) {
    switch (spec.t) {
      case 'num': return close(parseNum(raw), spec.v) ? 'ok' : 'bad';
      case 'set': {
        const got = parseSet(raw);
        const hit = got.filter(g => spec.v.some(e => close(g, e)));
        if (hit.length === got.length && got.length === spec.v.length) return 'ok';
        return hit.length === got.length && got.length > 0 && got.length < spec.v.length ? 'partial' : 'bad';
      }
      case 'point': return ptEq(parsePoint(raw), spec.v) ? 'ok' : 'bad';
      case 'points': {
        const got = parsePoints(raw);
        const hit = got.filter(g => spec.v.some(e => ptEq(g, e)));
        if (hit.length === got.length && got.length === spec.v.length) return 'ok';
        return hit.length === got.length && got.length < spec.v.length ? 'partial' : 'bad';
      }
      case 'expr': {
        const { vals, xs } = parseExprFn(raw);
        return xs.every((x, i) => close(vals[i], polyEval(spec.c, x))) ? 'ok' : 'bad';
      }
      case 'line': return lineEq(parseLine(raw), spec.m, spec.b) ? 'ok' : 'bad';
      case 'lines': {
        const got = parseLines(raw);
        const hit = got.filter(g => spec.v.some(e => lineEq(g, e.m, e.b)));
        if (hit.length === got.length && got.length === spec.v.length) {
          // each expected must be matched by a distinct student line
          const used = spec.v.every(e => got.some(g => lineEq(g, e.m, e.b)));
          return used ? 'ok' : 'bad';
        }
        return hit.length === got.length && got.length < spec.v.length ? 'partial' : 'bad';
      }
    }
    throw new Error('type ' + spec.t);
  }
  function check(spec, raw) {
    try { return { r: judge(spec, raw) }; } catch (e) { if (e instanceof Bad) return { r: 'error' }; throw e; }
  }
  function matchWrong(wrongs, defType, raw) {
    for (const w of wrongs || []) {
      const spec = Object.assign({ t: defType }, w);
      try { if (judge(spec, raw) === 'ok') return w; } catch (e) { if (!(e instanceof Bad)) throw e; }
    }
    return null;
  }

  // fit a polynomial (coeff array, low->high, degree<=5) to an expression in x; null if it is not one
  function polyOf(raw) {
    try {
      const { f, xs, vals } = parseExprFn(raw);
      const D = 5, px = [0, 1, 2, 3, 4, 5], py = px.map(x => evalNum(f, { x }));
      // Gaussian elimination on Vandermonde
      const n = D + 1, A = px.map((x, i) => { const r = []; for (let k = 0; k < n; k++) r.push(Math.pow(x, k)); r.push(py[i]); return r; });
      for (let i = 0; i < n; i++) {

  // ---------- practice ----------
  const HELP = {
    num: 'הקלידו מספר. אפשר גם שבר, למשל 2/3.',
    set: 'הקלידו את כל הערכים, מופרדים בפסיק, למשל: 2, -2',
    point: 'כתבו נקודה בצורה (x ; y), למשל (3 ; -2).',
    points: 'כתבו כל נקודה בסוגריים, מופרדות בפסיק: (1 ; 0), (3 ; -22)',
    expr: 'כתבו ביטוי עם x, למשל: 6x^2-4x+1',
    line: 'כתבו משוואת ישר, למשל: y=2x-5',
    lines: 'כתבו את המשוואות מופרדות בפסיק: y=..., y=...',
  };
  const PH = { num: 'מספר', set: '2, -2', point: '(3 ; -2)', points: '(1 ; 0), (3 ; -22)', expr: '6x^2-4x+1', line: 'y=2x-5', lines: 'y=..., y=...' };
  const KEYS = {
    num: [['+', '-', '*', '/', '(', ')', '.', 'back']],
    set: [['-', '/', '.', ',', 'back']],
    point: [['(', ')', ';', ',', '-', '/', '.', 'back']],
    points: [['(', ')', ';', ',', '-', '/', '.', 'back']],
    expr: [['x', '²', '³', '+', '-', '/', '(', ')', '.', 'back']],
    line: [['y', 'x', '=', '²', '³', '+', '-', '/', '(', ')', '.', 'back']],
    lines: [['y', 'x', '=', ',', '²', '³', '+', '-', '/', '(', ')', '.', 'back']],
  };

  function runPractice(mi, host) {
    const m = MODS[mi];
    host.append(h('div', { class: 'sec' }, 'עכשיו תורכם'));
    const nextItem = k => {
      if (k >= m.practice.length) return finishModule(mi, host);
      const card = buildItem(m.practice[k], k, m.practice.length, () => nextItem(k + 1));
      host.append(card); card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    nextItem(0);
  }
  function finishModule(mi, host) {
    const last = mi === MODS.length - 1;
    const card = h('div', { class: 'card finish' });
    if (!last) {
      card.append(h('div', { class: 'big' }, 'סיימתם את הנושא ✓'), h('p', null, 'מוכנים להמשיך?'), h('button', { class: 'btn', onclick: () => showModule(mi + 1) }, 'לנושא הבא: ' + MODS[mi + 1].title + ' ›'));
    } else {
      confetti();
      card.classList.add('final');
      card.append(h('div', { class: 'big' }, 'סיימתם את כל הנושאים! 🎉'),
        h('p', null, 'עכשיו יש לכם כל מה שצריך: כללי גזירה, שיפוע משיק, משוואת משיק, משיקים מקבילים ומאונכים, ומשיק שחותך את הגרף שוב.'),
        h('p', { class: 'wish' }, 'בהצלחה בתרגול בדף העבודה! 💪'),
        h('button', { class: 'btn soft', onclick: () => showModule(0) }, 'חזרה להתחלה'));
    }
    host.append(card); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function buildItem(it, ii, total, onDone) {
    const card = h('div', { class: 'card item' });
    card.append(h('div', { class: 'tag' }, 'תרגיל ' + (ii + 1) + ' מתוך ' + total), h('div', { class: 'prob', html: T(it.prompt) }));
    if (it.fig) card.append(h('div', { class: 'fig', html: fig(it.fig) }));
    const partsHost = h('div', { class: 'parts' }); card.append(partsHost);
    if (it.pad !== false) card.append(buildPad(it.pad || autoPad(it)));
    const stepMode = !!(it.parts[0] && it.parts[0].step);
    if (stepMode) {
      card.insertBefore(h('div', { class: 'hintline' }, 'אפשר לענות ישר על השאלה, בלי לעבור על השלבים. התאים נועדו להחליף כתיבה וחישובים בצד, ולעזור בדרך לתשובה.'), partsHost);
      const flagged = it.parts.some(p => p.fin);
      const isFin = (p, k) => flagged ? !!p.fin : k === it.parts.length - 1;
      const apis = []; let left = it.parts.filter(isFin).length;
      const finals = () => apis.filter(x => x.fin);
      it.parts.forEach((p, k) => {
        const fin = isFin(p, k);
        buildPart(p, k, it.parts.length, partsHost, () => { if (--left === 0) { card.classList.add('complete'); onDone(); } }, { optional: !fin, fin, finals, reg: x => apis.push(x), noFocus: k > 0 });
      });
      return card;
    }
    const run = k => {
      if (k >= it.parts.length) { card.classList.add('complete'); return onDone(); }
      buildPart(it.parts[k], k, it.parts.length, partsHost, () => run(k + 1));
    };
    run(0);
    return card;
  }

  function autoPad(it) {
    const checks = [], wrong = [], fns = [];
    const src = [it.prompt].concat(it.parts.map(p => p.q || '')).join(' ');
    src.replace(/\{\{([\s\S]+?)\}\}(?!\})/g, (_, m) => {
      const mm = m.match(/^([fgh])\(x\)\s*=\s*(.+)$/);
      if (mm) { const c = E.polyOf(mm[2].replace(/\\f\{([^{}]*)\}\{([^{}]*)\}/g, '(($1)/($2))').replace(/_\{?\d\}?/g, '')); if (c && c.length > 1) fns.push({ n: mm[1], c }); }
      return _;
    });
    it.parts.forEach(p => { checks.push({ ans: p.ans, final: true }); (p.wrong || []).forEach(w => wrong.push(w)); });
    const B = Engine.B;
    fns.forEach(f => {
      const d = E.P.der(f.c);
      checks.push({ ans: B.E(d), msg: '✓ נכון: זו הנגזרת ' + M(f.n + '\'(x)') + '. ממשיכים משם.' });
      wrong.push(...window.Content.derivWrongs(f.c));
      checks.push({ ans: B.E(f.c), msg: 'זו הפונקציה ' + M(f.n + '(x)') + ' עצמה. כתבו את השלב הבא.' });
    });
    return { checks, wrong };
  }

  function buildPad(cfg) {
    const det = h('details', { class: 'pad' });
    det.append(h('summary', null, '✏️ כלי עזרה: מקום לדרך ולחישובים'));
    const body = h('div', { class: 'padbody' });
    body.append(h('div', { class: 'padnote' }, 'כאן כותבים את הדרך, או מחשבים בצד. אפשר ללחוץ "בדיקה" על כל שורה ולקבל משוב על השלב. אם תכתבו חישוב עם מספרים בלבד, התוצאה תופיע.'));
    const lines = h('div', { class: 'padlines' });
    let cur = null;
    const addLine = () => {
      const inp = h('input', { type: 'text', class: 'in padin', dir: 'ltr', autocomplete: 'off', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', placeholder: 'שורה להקלדה' });
      const out = h('span', { class: 'padout' });
      inp.addEventListener('focus', () => { cur = inp; });
      inp.addEventListener('input', () => {
        const raw = inp.value.trim();
        const parts = raw.split('=').map(s => s.trim()).filter(Boolean), expr = parts.length ? parts[parts.length - 1] : '';
        const v = /[-+*/^²³]/.test(expr.replace(/^-/, '')) && !/[a-zA-Z]/.test(expr) ? E.calc(expr) : null;
        if (v == null) { out.textContent = ''; return; }
        const r = E.P.rat(v); out.textContent = '= ' + (r && r[1] > 1 ? r[0] + '/' + r[1] : String(+v.toFixed(6))).replace('-', '\u2212');
      });
      const fbk = h('div', { class: 'fb padfb', 'aria-live': 'polite' });
      const chk = () => {
        const raw = inp.value.trim(); if (!raw) { fbk.className = 'fb padfb'; fbk.textContent = ''; return; }
        const bad = r => { fbk.className = 'fb padfb warn'; fbk.innerHTML = r; };
        let cand, str = raw;
        if (/y/i.test(raw) && raw.includes('=')) cand = ['line', 'lines'];
        else if (raw.includes(';')) cand = ['point', 'points'];
        else if (raw.includes(',')) { cand = ['set']; str = raw.replace(/[a-z]\s*=/gi, ''); }
        else { const p = raw.split('=').map(s => s.trim()).filter(Boolean); str = p[p.length - 1] || ''; if (p.length === 2 && /x/i.test(p[0]) && !/x/i.test(p[1]) && !/^[xX]$/.test(p[0])) str = p[0];
          if (p.length === 2 && /^[xX]$/.test(p[0]) && !/x/i.test(p[1])) {
            let a = null; try { a = E.calc(p[1]); } catch (e) { }
            const pts = cfg.checks.filter(c => c.ans.t === 'point' && c.final).map(c => c.ans.v);
            if (a != null && pts.length && !cfg.checks.some(c => c.final && (c.ans.t === 'num' || c.ans.t === 'set'))) {
              const eq = (u, v) => Math.abs(u - v) <= 1e-6 * (1 + Math.abs(v));
              const w = (cfg.wrong || []).find(w => w.t === 'point' && eq(w.v[0], a));
              if (w) { bad(T(w.msg)); return; }
              if (pts.some(v => eq(v[0], a))) { fbk.className = 'fb padfb ok'; fbk.innerHTML = T('✓ ' + M('x=' + String(+a.toFixed(6))) + ' מתאים. עכשיו מצאו את ה-y של הנקודה.'); return; }
            }
          } cand = /x/i.test(str) ? ['expr'] : ['num', 'set']; }
        const type = cand[0];
        for (const c of cfg.checks) {
          if (!cand.includes(c.ans.t)) continue;
          const r = E.check(c.ans, str).r;
          if (r === 'error') { bad('לא הצלחתי לקרוא את השורה. בדקו סוגריים וסימנים.'); return; }
          if (r === 'ok' && c.expanded && /[()]/.test(str)) { fbk.className = 'fb padfb info'; fbk.textContent = 'הביטוי שווה לפונקציה, אבל עדיין לא פתחתם סוגריים. כפלו כל איבר בכל איבר וצמצמו.'; return; }
          if (r === 'ok') { fbk.className = 'fb padfb ok'; fbk.innerHTML = c.final ? '✓ זו כבר התשובה הסופית. כתבו אותה בשורת הפתרון למעלה.' : T(c.msg); return; }
          if (r === 'partial' && c.final) { fbk.className = 'fb padfb info'; fbk.textContent = 'חלק מהתשובה נכון, אבל יש עוד. בדקו אם פספסתם פתרון או נקודה.'; return; }
        }
        for (const t of cand) { const w = E.matchWrong(cfg.wrong || [], t, str); if (w) { bad(T(w.msg)); return; } }
        if (type === 'expr') {
          const got = E.polyOf(str);
          if (got) {
            let best = null;
            for (const c of cfg.checks) {
              if (c.ans.t !== 'expr') continue;
              const tg = c.ans.c, len = Math.max(tg.length, got.length), diff = [];
              for (let k = 0; k < len; k++) if (Math.abs((tg[k] || 0) - (got[k] || 0)) > 1e-9) diff.push(k);
              if (diff.length && diff.length <= 2 && tg.length >= 2 && (!best || diff.length < best.diff.length)) best = { tg, diff };
            }
            if (best) {
              const nm = k => k === 0 ? 'האיבר החופשי (המספר בלי x)' : (k === 1 ? 'האיבר עם x' : 'האיבר עם ' + M('x^' + k));
              const parts = best.diff.map(k => (got[k] || 0) === 0 ? 'נראה שחסר ' + nm(k) + '.' : 'בדקו את ' + nm(k) + '.');
              bad('קרוב! ' + T(parts.join(' ')));
              return;
            }
          }
          bad('לא זיהיתי את הביטוי הזה כשלב נכון בדרך. עברו עליו שוב, או צמצמו איברים דומים וכתבו שוב.');
        } else bad(type === 'num' ? 'המספר הזה לא מתאים לדרך הנכונה. בדקו את ההצבה והחישוב.' : 'זה לא מתאים לדרך הנכונה. בדקו שוב את השלב.');
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); chk(); } });
      inp.addEventListener('input', () => { fbk.className = 'fb padfb'; fbk.textContent = ''; });
      lines.append(h('div', { class: 'padline' }, h('div', { class: 'padrow' }, inp, out, h('button', { type: 'button', class: 'btn', onclick: chk }, 'בדיקה')), fbk));
      cur = inp; return inp;
    };
    addLine();
    const press = ch => {
      const input = cur || addLine();
      const len = input.value.length;
      const st = input.selectionStart == null ? len : input.selectionStart, en = input.selectionEnd == null ? st : input.selectionEnd;
      let v = input.value, p;
      if (ch === 'back') { if (st !== en) { v = v.slice(0, st) + v.slice(en); p = st; } else if (st > 0) { v = v.slice(0, st - 1) + v.slice(st); p = st - 1; } else p = 0; }
      else { v = v.slice(0, st) + ch + v.slice(en); p = st + ch.length; }
      input.value = v; input.dispatchEvent(new Event('input')); input.focus(); input.setSelectionRange(p, p);
    };
    const rows = [['x', '²', '³', '=', '+', '-', '*'], ['/', '(', ')', '.', 'back']];
    const keys = h('div', { class: 'keys', dir: 'ltr' }, rows.map(row => h('div', { class: 'krow' }, row.map(ch => h('button', { type: 'button', class: 'key' + (ch === 'back' ? ' wide' : ''), tabindex: '-1', onclick: () => press(ch) }, ch === 'back' ? '⌫' : (ch === '*' ? '×' : ch))))));
    body.append(lines, h('button', { type: 'button', class: 'btn soft', onclick: () => addLine().focus() }, '+ שורה'), keys);
    det.append(body);
    return det;
  }

  function buildPart(part, k, n, host, onDone, opts) {
    opts = opts || {};
    const type = part.ans.t;
    const box = h('div', { class: 'part' });
    if (part.q) box.append(h('div', { class: 'pq' }, n > 1 ? h('b', null, part.step ? 'שלב ' + (k + 1) + '. ' : LETTERS[k] + '. ') : null, h('span', { html: T(part.q) })));
    const input = h('input', { type: 'text', class: 'in', dir: 'ltr', autocomplete: 'off', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done', placeholder: PH[type], 'aria-label': 'התשובה שלכם', id: 'in' + Math.random().toString(36).slice(2) });
    const press = ch => {
      const len = input.value.length;
      const st = input.selectionStart == null ? len : input.selectionStart, en = input.selectionEnd == null ? st : input.selectionEnd;
      let v = input.value, p;
      if (ch === 'back') { if (st !== en) { v = v.slice(0, st) + v.slice(en); p = st; } else if (st > 0) { v = v.slice(0, st - 1) + v.slice(st); p = st - 1; } else p = 0; }
      else { v = v.slice(0, st) + ch + v.slice(en); p = st + ch.length; }
      input.value = v; input.focus(); input.setSelectionRange(p, p);
    };
    const keys = h('div', { class: 'keys', dir: 'ltr' }, KEYS[type].map(row => h('div', { class: 'krow' }, row.map(ch => h('button', { type: 'button', class: 'key' + (ch === 'back' ? ' wide' : ''), tabindex: '-1', 'aria-label': ch === 'back' ? 'מחיקה' : ch, onclick: () => press(ch) }, ch === 'back' ? '⌫' : (ch === '*' ? '×' : ch))))));
    const checkBtn = h('button', { class: 'btn', type: 'button' }, 'בדיקה');
    const hintBtn = h('button', { class: 'btn soft', type: 'button' }, 'רמז');
    const row = h('div', { class: 'row' }, input, checkBtn);
    const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
    const hints = h('div', { class: 'hints' });
    const extra = h('div', { class: 'extra' });
    box.append(row, keys, h('div', { class: 'tools' }, hintBtn), fb, hints, extra);
    host.append(box);
    if (k > 0 && !opts.noFocus) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (!opts.noFocus) setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { } }, 50);

    let tries = 0, hintLvl = 0, finished = false;
    const showHint = () => {
      if (hintLvl >= part.hint.length) { fb.className = 'fb info'; fb.innerHTML = 'זה כל הרמזים. אפשר לנסות שוב, ואם צריך לראות את הפתרון המלא לחצו על "הצגת פתרון".'; ensureSolBtn(); return; }
      hints.append(h('div', { class: 'hint', html: '💡 ' + T(part.hint[hintLvl++]) }));
    };
    hintBtn.onclick = showHint;
    let solBtn = null;
    const ensureSolBtn = () => { if (solBtn || finished) return; solBtn = h('button', { class: 'btn soft', type: 'button', onclick: () => revealSolution(false) }, 'הצגת פתרון'); box.querySelector('.tools').append(solBtn); };
    const lock = () => { finished = true; input.disabled = true; checkBtn.disabled = true; hintBtn.disabled = true; keys.remove(); if (solBtn) solBtn.remove(); };
    const solutionNode = () => h('div', { class: 'sol' }, h('div', { class: 'tag' }, 'הפתרון'), h('ol', null, part.sol.map(s => h('li', { html: T(s) }))));
    function revealSolution(auto) {
      if (finished) return; lock();
      if (opts.optional) { fb.className = 'fb info'; fb.textContent = 'הנה הפתרון של השלב.'; extra.append(solutionNode()); return; }
      S.streak = 0; drawStreak();
      fb.className = 'fb info';
      fb.innerHTML = auto ? 'בואו נעבור על הפתרון יחד. זה לא נורא, ככה לומדים, והשאלה הבאה תצליח.' : 'הנה הפתרון. קראו אותו שלב אחר שלב, ואז נמשיך.';
      extra.append(solutionNode(), h('button', { class: 'btn', onclick: function () { this.remove(); onDone(); } }, 'הבנתי, ממשיכים ›'));
      extra.lastChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function success() {
      const first = tries === 0;
      if (opts.optional) {
        lock(); fb.className = 'fb ok'; fb.innerHTML = '✓ נכון!' + (part.after ? '<div class="after">' + T(part.after) + '</div>' : ''); input.classList.add('good');
        extra.append(h('button', { class: 'link', onclick: function () { this.replaceWith(solutionNode()); } }, 'לצפייה בפתרון'));
        return;
      }
      lock(); S.streak++; drawStreak();
      const s = S.streak; let msg = pick(PRAISE);
      if (s % 3 === 0) { msg = 'שלוש ברצף! 🎉'; confetti(); }
      else if (s % 3 === 2) msg += ' שניים ברצף, עוד אחד והקונפטי שלכם.';
      else if (!first) msg = 'הצלחתם! ' + pick(['התחזקתם בדרך.', 'התיקון עבד.', 'ככה לומדים.']);
      clap(msg.replace(/\s.*$/, '') === msg ? msg : msg);
      fb.className = 'fb ok'; fb.innerHTML = '✓ ' + msg + (part.after ? '<div class="after">' + T(part.after) + '</div>' : '');
      input.classList.add('good');
      const sb = h('button', { class: 'link', onclick: function () { this.replaceWith(solutionNode()); } }, 'לצפייה בפתרון המלא');
      extra.append(sb);
      setTimeout(onDone, 650);
    }
    function check() {
      if (finished) return;
      const raw = input.value.trim();
      if (!raw) { fb.className = 'fb info'; fb.textContent = HELP[type]; input.focus(); return; }
      if (opts.optional && opts.finals) {
        const fp = opts.finals().find(f => !f.done() && f.type === type && E.check(f.part.ans, raw).r === 'ok');
        if (fp && E.check(part.ans, raw).r !== 'ok') {
          fp.solveWith(raw); lock(); fb.className = 'fb ok'; fb.textContent = '✓ זו כבר התשובה הסופית. כל הכבוד!'; input.classList.add('good'); return;
        }
      }
      if (part.noParen && /[()]/.test(raw)) { fb.className = 'fb warn'; fb.textContent = 'כתבו את הביטוי בלי סוגריים: פותחים סוגריים ומצמצמים איברים דומים.'; return; }
      const r = E.check(part.ans, raw).r;
      if (r === 'error') { fb.className = 'fb info'; fb.innerHTML = 'לא הצלחתי לקרוא את התשובה. ' + HELP[type]; return; }
      if (r === 'ok') return success();
      tries++; if (!opts.optional) { S.streak = 0; drawStreak(); }
      const w = E.matchWrong(part.wrong || [], type, raw);
      let msg;
      if (w) msg = w.msg;
      else if (r === 'partial') msg = part.partialMsg || 'חלק מהתשובה נכון, אבל היא עדיין לא שלמה. בדקו אם פספסתם פתרון או נקודה.';
      else msg = tries === 1 ? 'עדיין לא. בדקו את החישוב שוב, ואפשר ללחוץ על "רמז".' : 'כמעט. נסו לעבור על השלבים אחד אחד.';
      fb.className = 'fb warn'; fb.innerHTML = T(msg);
      if (tries === 2 && hintLvl === 0) showHint();
      if (tries >= 2) ensureSolBtn();
      if (tries >= 3 && !opts.optional) { setTimeout(() => revealSolution(true), 900); }
      input.select();
    }
    if (opts.reg) opts.reg({ fin: opts.fin, part, type, done: () => finished, solveWith: raw => { input.value = raw; success(); } });
    checkBtn.onclick = check;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  }

  // ---------- init ----------
  drawStreak();
  let start = 0;
  try { const v = parseInt(localStorage.getItem('deriv-mod'), 10); if (v >= 0 && v < MODS.length) start = v; } catch (e) { }
  showModule(start, true);
  window.__lesson = { showModule, S };
})();

</script>
</body>
</html>
