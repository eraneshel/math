<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>טריגונומטריה</title><style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap');
:root{--ink:#10181f;--mut:#5b6872;--line:#e3e8ec;--bg:#f6f8f5;--g:#3fae2a;--gd:#2f8a1e;--navy:#0e1a24;--y:#ffc83d;--p:#7a5af8;--o:#ff8a3d;--c:#19b5c9;--pk:#ff5c8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,Heebo,Arial,sans-serif;color:var(--ink);background:var(--bg);direction:rtl;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 36px}
.btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:12px 26px;border-radius:14px;border-bottom:4px solid var(--gd);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.off{background:#e8ecef;color:#8a969f;border-bottom-color:#d3dade;pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
h2.sec{font-size:26px;font-weight:800;margin:30px 0 14px}
h2.sec small{font-size:15px;font-weight:500;color:var(--mut);margin-right:8px}
.grid{display:grid;gap:16px}
.card{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
a.card:hover{transform:translateY(-3px);border-color:var(--cc,var(--g))}
.card .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--cc,var(--g))}
.card h3{font-size:21px;font-weight:800;line-height:1.25}.card p{color:var(--mut);font-size:15px}
.tag{align-self:flex-start;font-size:13px;font-weight:700;border-radius:99px;padding:3px 12px;background:#eaf7e6;color:var(--gd)}
.tag.soon{background:#eef1f3;color:#7d8a93}
@media(max-width:700px){.wrap{padding:12px 12px 28px}h2.sec{font-size:22px}}

.hero{background:var(--navy);border-radius:28px;color:#fff;padding:44px 40px;position:relative;overflow:hidden;display:flex;gap:30px;align-items:center}
.hero:before{content:"π  ∠  √  Σ  ∞  ∥  △";position:absolute;inset:auto 0 -20px 0;font:800 90px Rubik;color:#ffffff0d;white-space:nowrap;letter-spacing:18px;text-align:center}
.hero .t{flex:1;position:relative;z-index:1}
.hero .k{display:inline-block;background:#ffffff1a;border-radius:99px;padding:4px 16px;font-size:14px;font-weight:500;margin-bottom:14px}
.hero h1{font-size:46px;font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p{font-size:18px;color:#c4d0d8;max-width:520px;margin-bottom:22px}
.hero .fig{flex:0 0 250px;position:relative;z-index:1}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:18px;text-align:center}
.step b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--y);font-weight:800;font-size:20px;margin:0 auto 8px}
.step h4{font-size:18px;font-weight:800}.step p{color:var(--mut);font-size:15px}
@media(max-width:700px){.hero{flex-direction:column;padding:28px 22px;text-align:center}.hero h1{font-size:32px}.hero p{font-size:16px}.hero .fig{flex:none;width:200px}.steps{grid-template-columns:1fr}}

.q{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:20px;margin-bottom:18px}
.qh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qn{width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--y);font-weight:800;font-size:22px;display:grid;place-items:center}
.qh h2{font-size:24px;font-weight:800}
.row{display:flex;gap:22px;align-items:flex-start}
.q .fig{flex:0 0 330px;background:#f6f8f5;border:2px solid var(--line);border-radius:16px;padding:10px}
.q .fig svg{width:100%;height:auto}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.65}
.question-box{background:#fff8e1;border:2px solid #ffe29a;border-radius:14px;padding:12px 14px}
.parts{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.parts p{margin-bottom:8px}.parts p:last-child{margin:0}
.math-expr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}
.geo-line-base{stroke:#2b3b49;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.geo-line-med{stroke:#6b7c8b;stroke-width:1.5}.geo-line-dashed{stroke:#8a9ba8;stroke-width:1.5;stroke-dasharray:4,4}.geo-point{fill:#1b2733}
.geo-text{font-family:'Frank Ruhl Libre',Georgia,serif;font-style:italic;font-size:14px;fill:#1b2733;font-weight:bold;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
text{text-anchor:middle}
.act{display:flex;align-items:center;gap:12px;margin-top:4px}
@media(max-width:700px){.row{flex-direction:column}.q .fig{flex:none;width:100%}.qh h2{font-size:20px}}

.hero{background:linear-gradient(135deg,#1d3a8f 0%,#2a52bd 100%)!important}.hero .k{background:#ffffff26}.hero p{color:#dbe5ff}.hero .crumb,.hero .crumb a{color:#c9d7fb!important}.hero:before{color:#ffffff12}
.hero .crumb{font-size:14px;color:#9fb0bc;margin-bottom:12px}.hero .crumb a{color:#c4d0d8;text-decoration:none}
.hero .figp{background:#fff;border-radius:18px;padding:10px}.hero .figp svg{width:100%;height:auto;display:block}
.pick{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:12px}
.nums a,.nums span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border-radius:16px;font-weight:800;font-size:26px;text-decoration:none;border:2px solid var(--line);border-bottom-width:5px;background:#fff;color:var(--ink)}
.nums a.on{background:var(--g);border-color:var(--gd);color:#fff}.nums small{font-size:12px;font-weight:700}
.nums span{color:#9aa6ae;background:#f0f3f5}.nums a:hover{transform:translateY(-2px)}
.q{scroll-margin-top:14px}
.deck{display:block;width:100%;aspect-ratio:16/9;height:auto;border:0;border-radius:20px;background:#f6f8f5}@media(max-width:700px){.deck{height:92vh;min-height:560px}}</style></head><body><div class="wrap"><section class="hero"><div class="t"><div class="crumb"><a href="../../../" target="_top">בית</a> › <a href="../../" target="_top">כיתה י׳</a> › <a href="../" target="_top">גאומטריה, טריגונומטריה ואנליטית</a> › טריגונומטריה</div><span class="k">כיתה י׳ · 5 יחידות</span><h1><em>טריגונומטריה</em></h1><p>סינוס, קוסינוס וטנגנס במשולש ישר־זווית.</p><a class="btn ghost" href="../" target="_top">→ חזרה לתתי הנושאים</a></div><div class="fig"><svg viewBox="-14 -6 280 214" width="100%"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="80" cy="100" r="64" stroke="#fff" stroke-width="3"/><path d="M10 100H150M80 30V170" stroke="#fff" stroke-width="2"/><path d="M80 100L128 58" stroke="#ffc83d" stroke-width="5"/><path d="M128 58V100" stroke="#ff5c8a" stroke-width="5"/><path d="M80 100H128" stroke="#19b5c9" stroke-width="5"/><path d="M104 100a24 24 0 0 0 -4 -10" stroke="#ffc83d" stroke-width="3"/><text x="106" y="92" fill="#ffc83d" font-family="Rubik" font-weight="700" font-size="16">θ</text><path d="M170 100Q190 40 205 100T240 100" stroke="#3fae2a" stroke-width="5" transform="translate(0,0)"/><g fill="#fff"><circle cx="80" cy="100" r="6"/><circle cx="128" cy="58" r="6"/></g></g></svg></div></section><div class="card" style="border-style:dashed;margin-top:26px;text-align:center;color:var(--mut)"><h3>הנושאים והשאלות יתווספו בקרוב</h3><p>הדף כבר מוכן, והתכנים ייכנסו לפי הסדר.</p></div></div><div style="text-align:center;color:#8a969f;font-size:14px;padding:6px 0 22px">מתמטיקה · לכל בעיה יש פתרון, להנות מהאתגר</div></body></html>
